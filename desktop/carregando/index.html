<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kaizen</title>
    <!-- Tela de abertura do app de computador: aparece enquanto o servidor sobe. -->
    <style>
        :root { --fundo: #f7f7f5; --texto: #1d1d1b; --suave: #6b6b66; --marca: #c90016; }
        @media (prefers-color-scheme: dark) {
            :root { --fundo: #161615; --texto: #f2f2ee; --suave: #a3a39c; }
        }
        html, body { height: 100%; margin: 0; }
        body {
            display: grid; place-items: center; background: var(--fundo); color: var(--texto);
            font-family: "Noto Sans JP", system-ui, Arial, sans-serif; user-select: none;
        }
        main { text-align: center; padding: 16px; }
        img { width: 96px; height: 96px; border-radius: 22px; }
        h1 { margin: 18px 0 4px; font-size: 26px; letter-spacing: .02em; }
        p { margin: 0; color: var(--suave); font-size: 14px; }
        .barra { width: 160px; height: 3px; margin: 22px auto 0; background: color-mix(in srgb, var(--marca) 18%, transparent); border-radius: 3px; overflow: hidden; }
        .barra::after { content: ""; display: block; width: 40%; height: 100%; background: var(--marca); border-radius: 3px; animation: correr 1.1s ease-in-out infinite; }
        @keyframes correr { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
        .erro .barra { display: none; }
        .erro p { color: var(--marca); max-width: 420px; }
    </style>
</head>
<body>
    <main>
        <img src="icone.png" alt="">
        <h1>Kaizen</h1>
        <p id="mensagem">改善 — abrindo…</p>
        <div class="barra"></div>
    </main>
    <script>
        /* O app chama isso se o servidor não subir. */
        window.mostrarErro = (texto) => {
            document.body.classList.add("erro");
            document.getElementById("mensagem").textContent = texto;
        };
    </script>
</body>
</html>
