# Gera os instaladores do Kaizen e publica na página Releases do GitHub.
# Dispara com uma tag de versão:  git tag v1.0.0 && git push origin v1.0.0
# Precisa do segredo TAURI_SIGNING_PRIVATE_KEY (conteúdo de ~/.tauri/kaizen.key),
# que assina as atualizações automáticas.
name: Lançamento

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instaladores:
    strategy:
      fail-fast: false
      matrix:
        include:
          - sistema: ubuntu-22.04
            alvo: x86_64-unknown-linux-gnu
          - sistema: windows-latest
            alvo: x86_64-pc-windows-msvc
          - sistema: macos-latest
            alvo: aarch64-apple-darwin
    runs-on: ${{ matrix.sistema }}
    steps:
      - uses: actions/checkout@v4

      - name: Versão do app = versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            const caminho = "desktop/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(caminho, "utf8"));
            conf.version = v;
            fs.writeFileSync(caminho, JSON.stringify(conf, null, 2));
            console.log("versão", v);
          '

      - name: Bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Servidor Python empacotado (sidecar)
        run: |
          python -m pip install pyinstaller
          python desktop/empacotar_servidor.py ${{ matrix.alvo }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.alvo }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - run: npm ci
        working-directory: desktop

      # o que mudou nesta versão, tirado do novidades.json (o mesmo que o app mostra)
      - name: Notas da versão
        id: notas
        shell: bash
        run: |
          {
            echo "texto<<FIM_NOTAS"
            node -e '
              const v = (process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
              const lista = require("./novidades.json");
              const nota = lista.find((n) => n.versao === v) || lista[0];
              console.log(nota.itens.map((i) => "- " + i).join("\n"));
            '
            echo "FIM_NOTAS"
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: "Kaizen ${{ github.ref_name }}"
          releaseBody: |
            ${{ steps.notas.outputs.texto }}

            ---

            Baixe o instalador do seu sistema em **Assets**, logo abaixo:
            - **Windows:** `Kaizen_..._x64-setup.exe`
            - **Linux:** `.deb` (Ubuntu/Debian) ou `.AppImage` (qualquer distro)
            - **Mac (Apple Silicon):** `.dmg`

            Primeira vez no Windows: se aparecer "O Windows protegeu o computador", clique em **Mais informações → Executar assim mesmo** (o app não tem certificado pago).
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --target ${{ matrix.alvo }}
