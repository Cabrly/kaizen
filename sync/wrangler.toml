name = "kaizen-sync"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# um Durable Object por código de sincronia, guardado em SQLite (incluso no plano grátis)
[[durable_objects.bindings]]
name = "COFRES"
class_name = "Cofre"

# contagens anônimas de uso (um objeto só, "geral")
[[durable_objects.bindings]]
name = "ESTATISTICAS"
class_name = "Estatisticas"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Cofre"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Estatisticas"]

# limites por IP (grátis): um geral, folgado pro uso normal, e um apertado pra
# código que não existe — é o que alguém tentando adivinhar códigos faria
[[ratelimits]]
name = "LIMITE_GERAL"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMITE_ERROS"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LIMITE_NOVOS"
namespace_id = "1003"
simple = { limit = 3, period = 60 }

# o app manda 1 abertura por dia e poucos pacotes de contagem; o site, uma visita por sessão
[[ratelimits]]
name = "LIMITE_USO"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

# IA do Kaizen: por IP, 10 pedidos por minuto (um plano grande gasta uns 3 de uma vez)
[[ratelimits]]
name = "LIMITE_IA"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

# IA grátis por dia: o total fica abaixo das 7000 da chave; cada aparelho, 40 (um plano gasta ~4,
# cada sessão estudada ~1-2, cada mensagem do chat 1); por IP mais folgado (CGNAT junta muita gente num IP)
[vars]
IA_COTA_DIA = "6500"
IA_POR_IP = "300"
IA_POR_USUARIO = "40"
