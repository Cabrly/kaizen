name = "kaizen-sync"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# um Durable Object por código de sincronia, guardado em SQLite (incluso no plano grátis)
[[durable_objects.bindings]]
name = "COFRES"
class_name = "Cofre"

# contagens anônimas de uso (um objeto só, "geral")
[[durable_objects.bindings]]
name = "ESTATISTICAS"
class_name = "Estatisticas"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Cofre"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Estatisticas"]

# limites por IP (grátis): um geral, folgado pro uso normal, e um apertado pra
# código que não existe — é o que alguém tentando adivinhar códigos faria
[[ratelimits]]
name = "LIMITE_GERAL"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "LIMITE_ERROS"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LIMITE_NOVOS"
namespace_id = "1003"
simple = { limit = 3, period = 60 }

# o app manda 1 abertura por dia e poucos pacotes de contagem; o site, uma visita por sessão
[[ratelimits]]
name = "LIMITE_USO"
namespace_id = "1004"
simple = { limit = 20, period = 60 }

# IA do Kaizen: por IP, 10 pedidos por minuto (um plano grande gasta uns 3 de uma vez)
[[ratelimits]]
name = "LIMITE_IA"
namespace_id = "1005"
simple = { limit = 10, period = 60 }

# IA grátis por dia. OpenRouter grátis: 50 pedidos por dia; Gemini no nível gratuito: 20 por dia em CADA
# modelo (4 no worker.js ≈ 80). Juntos ≈ 130. Cada aparelho, 10 (um plano gasta ~3, cada sessão estudada 1, cada correção 1); por IP
# o dobro (CGNAT junta gente num IP). Com faturamento ativado no Google, sobe tudo (ex.: 6500 / 300 / 40).
[vars]
IA_COTA_DIA = "120"
IA_POR_IP = "20"
IA_POR_USUARIO = "10"
